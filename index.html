<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Account Cave | Powered by Yeaf Neural Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020408;
            --accent-emerald: #00FFA3;
            --accent-cyan: #00D4FF;
            --accent-rose: #FF6EC7;
            --accent-amber: #FFD500;
            --accent-violet: #A855F7;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-deep);
            color: #ffffff;
            overflow: hidden;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Chromatic Glass Morph */
        .atomic-glass {
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .atomic-glass:hover {
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 20px 60px -10px rgba(0,0,0,0.9);
        }

        /* Module-Specific Spectral Backgrounds */
        .spectrum-expenses { background: radial-gradient(circle at top left, rgba(255,110,199,0.08), transparent 40%); }
        .spectrum-income { background: radial-gradient(circle at top left, rgba(0,255,163,0.08), transparent 40%); }
        .spectrum-assets { background: radial-gradient(circle at top left, rgba(168,85,247,0.08), transparent 40%); }
        .spectrum-ideas { background: radial-gradient(circle at top left, rgba(0,212,255,0.08), transparent 40%); }

        .neural-wave {
            animation: wave-pulse 1.5s ease-in-out infinite;
        }

        @keyframes wave-pulse {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 0 0px var(--accent-emerald); }
            100% { transform: scale(1.4); opacity: 0; box-shadow: 0 0 0 20px transparent; }
        }

        .orb-gradient {
            background: conic-gradient(from 180deg at 50% 50%, #00FFA3 0deg, #00D4FF 120deg, #FF6EC7 240deg, #00FFA3 360deg);
            animation: orb-spin 10s linear infinite;
        }

        @keyframes orb-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .text-glow { text-shadow: 0 0 15px currentColor; }

        .ripple-effect {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.475.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
